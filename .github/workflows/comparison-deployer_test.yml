name: "📊 Thesis Comparison Dashboard Deployer"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-comparison:
    name: Compile Core Comparison Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Verify files are pulled properly from the main branch tree
      - name: 📁 Verify Main Branch Database Files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p all-results
          ls -la all-results/accumulated_database.json || echo "Warning: AI database not found"
          ls -la all-results/human_accumulated_database.json || echo "Warning: Human database not found"

      - name: Run Comparison Aggregator
        run: |
          python scripts/generate_comparison_dashboard.py

      # Archive the report so you can download it directly as a ZIP artifact
      - name: 📦 Archive Thesis Comparative Report Package
        uses: actions/upload-artifact@v4
        with:
          name: compiled-thesis-comparative-dashboard
          path: docs/THESIS_COMPARATIVE_ANALYSIS_ver2.html
          retention-days: 7

      # 🚀 Updated to push directly back to the main branch
      - name: 🚀 Commit Page to Main Branch
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # Pull latest remote changes from main to avoid conflicts
          git pull origin main
          
          # Stage and commit the updated report asset
          git add docs/THESIS_COMPARATIVE_ANALYSIS_ver2.html
          git commit -m "docs: automated refresh of master comparative dashboard" || echo "No changes to commit"
          
          # Push directly back up to main
          git push origin main
